<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio — Vidéaste freelance</title>
  <meta name="description" content="Portfolio vidéo et photo : clips, événementiel, sport, contenus pour les réseaux sociaux, storyboards et photographie.">
  <meta name="theme-color" content="#0b1026">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ==================================================================
   PORTFOLIO macOS — style.css (système : bureau, fenêtres, menus, Dock)
   Optimisé : fond d'écran statique, aucun flou derrière les fenêtres,
   animations limitées à transform / opacity.
   ================================================================== */

/* ---------- Variables ---------- */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, "Segoe UI", sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --mb: 28px;
  --rw: 12px;
  --accent: #0a84ff;
  --spring: cubic-bezier(.2, .9, .3, 1.15);
  --out: cubic-bezier(.16, 1, .3, 1);
  --red: #ff453a; --orange: #ff9f0a; --green: #30d158; --violet: #9b7bff;
}
html[data-theme="dark"] {
  --text: #f5f5f7; --text-2: rgba(245,245,247,.66); --text-3: rgba(245,245,247,.42);
  --win-bg: #1e1e20; --win-border: rgba(255,255,255,.13); --side-bg: #2a2a2d; --bar-bg: #262628;
  --panel: rgba(255,255,255,.055); --panel-2: rgba(255,255,255,.1); --line: rgba(255,255,255,.09);
  --glass-bg: rgba(38,38,46,.62); --glass-border: rgba(255,255,255,.18); --hover: rgba(255,255,255,.08);
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 12px 36px rgba(0,0,0,.35);
  --field: rgba(255,255,255,.07); --sel: #0a5fd1;
}
html[data-theme="light"] {
  --text: #1d1d1f; --text-2: rgba(29,29,31,.62); --text-3: rgba(29,29,31,.42);
  --win-bg: #ffffff; --win-border: rgba(0,0,0,.14); --side-bg: #ebebed; --bar-bg: #f6f6f6;
  --panel: rgba(0,0,0,.035); --panel-2: rgba(0,0,0,.07); --line: rgba(0,0,0,.09);
  --glass-bg: rgba(246,246,250,.72); --glass-border: rgba(255,255,255,.7); --hover: rgba(0,0,0,.05);
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 12px 36px rgba(0,0,0,.18);
  --field: rgba(0,0,0,.05); --sel: #0a6cff;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; background: #000; }
body { font-family: var(--font); color: var(--text); font-size: 13px; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: default; }
input, textarea, select { font: inherit; color: inherit; user-select: text; -webkit-user-select: text; }
a { color: inherit; text-decoration: none; }
svg { display: block; }
img, video { display: block; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.noscript { position: fixed; inset: 0; display: grid; place-items: center; background: #000; color: #fff; font-family: var(--font); }

/* ---------- Verre (petits éléments seulement) ---------- */
.glass {
  background: var(--glass-bg);
  -webkit-backdrop-filter: blur(20px) saturate(170%);
  backdrop-filter: blur(20px) saturate(170%);
  border: 1px solid var(--glass-border);
  box-shadow: var(--glass-shadow);
}

/* ---------- Boutons génériques ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 30px; padding: 0 14px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); transition: transform .15s var(--spring), background .15s, filter .15s; cursor: pointer; white-space: nowrap; }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn:hover { filter: brightness(1.12); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; pointer-events: none; }
.btn.primary { background: linear-gradient(180deg, #3d9bff, #0a6cff); color: #fff; border-color: rgba(255,255,255,.2); box-shadow: 0 2px 8px rgba(10,108,255,.3); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 7px; }

/* ==================================================================
   ARRIVÉE — le MacBook posé sur la table
   ================================================================== */
.landing { position: fixed; inset: 0; z-index: 9900; overflow: hidden; background: #0e0f13; color: #fff; touch-action: none; }
.landing.out { opacity: 0; transition: opacity .5s ease; pointer-events: none; }
.ld-scene { position: absolute; inset: 0; transform-origin: 0 0; }
.landing.zooming .ld-scene { will-change: transform; }
.ld-photo { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; opacity: 0; transition: opacity .7s ease; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.landing.ready .ld-photo { opacity: 1; }
/* léger vignettage, comme sur une vraie photo */
.ld-scene::after { content: ""; position: absolute; inset: -2px; pointer-events: none; background: radial-gradient(120% 95% at 50% 45%, transparent 55%, rgba(0,0,0,.45)); }
.landing.zooming .ld-scene::after { opacity: 0; }
.ld-hit { position: absolute; border: 0; padding: 0; border-radius: 12px; cursor: pointer; background: none; }
/* l'écran « vivant » est posé pile sur l'écran du rendu (transformation matrix3d) */
.ld-screen { position: absolute; left: 0; top: 0; width: 1000px; height: 649px; transform-origin: 0 0; overflow: hidden; container-type: inline-size; background: #0b1028; cursor: pointer; outline: none; opacity: 0; transition: opacity .5s ease .2s, filter .25s ease; backface-visibility: hidden; }
.landing.ready .ld-screen { opacity: 1; }
.ld-screen::before { content: ""; position: absolute; z-index: 3; left: 50%; top: 0; width: 11%; height: 3.2%; margin-left: -5.5%; border-radius: 0 0 11px 11px; background: #050506; }
.ld-screen:hover, .ld-screen:focus-visible, .ld-hit:hover ~ .ld-screen { filter: brightness(1.12); }
/* écran : réplique de l'écran verrouillé */
.lds-wp { position: absolute; inset: 0; background-size: cover; background-position: center; }
.lds-wp svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.lds-lock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 60px; background: rgba(6,8,20,.28); text-align: center; }
.lds-date { font-size: 23px; font-weight: 600; opacity: .92; }
.lds-time { font-size: 150px; font-weight: 700; letter-spacing: -.04em; line-height: 1; color: rgba(255,255,255,.92); font-variant-numeric: tabular-nums; }
.lds-user { margin-top: auto; margin-bottom: 45px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lds-av { width: 75px; height: 75px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 26px; font-weight: 800; background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.12)); border: 1px solid rgba(255,255,255,.4); }
.lds-av img { width: 100%; height: 100%; object-fit: cover; }
.lds-user b { font-size: 18px; } .lds-user small { font-size: 13px; opacity: .7; }
.lds-glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.1), transparent 35%, transparent 70%, rgba(255,255,255,.04)); pointer-events: none; }
/* interface */
.ld-ui { position: absolute; inset: 0; pointer-events: none; }
.ld-brand { position: absolute; left: 28px; top: 24px; display: flex; align-items: center; gap: 12px; }
.ld-mono { width: 38px; height: 38px; } .ld-mono svg { width: 100%; height: 100%; }
.ld-brand b { display: block; font-size: 15px; letter-spacing: -.01em; } .ld-brand small { font-size: 12px; opacity: .6; }
.ld-skip { position: absolute; right: 26px; top: 26px; height: 34px; padding: 0 16px; border-radius: 17px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; pointer-events: auto; }
.ld-skip:hover { background: rgba(255,255,255,.18); }
.ld-hint { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 26px; background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); font-size: 13.5px; font-weight: 500; white-space: nowrap; animation: fadeIn 1s .8s both; }
.ld-mouse { position: relative; width: 20px; height: 30px; border-radius: 10px; border: 2px solid rgba(255,255,255,.8); }
.ld-mouse i { position: absolute; left: 50%; top: 5px; width: 3px; height: 6px; margin-left: -1.5px; border-radius: 2px; background: #fff; animation: wheelDot 1.6s ease-in-out infinite; }
@keyframes wheelDot { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(9px); opacity: 0; } 100% { transform: translateY(0); opacity: 0; } }
@media (max-width: 760px) { .ld-hint { font-size: 12.5px; bottom: 22px; } .ld-brand { left: 16px; top: 16px; } .ld-skip { right: 14px; top: 18px; } }

/* ---------- Démarrage ---------- */
.boot { position: fixed; inset: 0; z-index: 9000; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 56px; transition: opacity .7s ease, visibility .7s; cursor: pointer; }
.boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
.boot-logo { width: 92px; height: 92px; animation: bootIn 1s var(--out) both; }
.boot-bar { width: 190px; height: 5px; border-radius: 5px; background: rgba(255,255,255,.18); overflow: hidden; animation: fadeIn .5s .3s both; }
.boot-bar span { display: block; height: 100%; width: 100%; background: #fff; border-radius: inherit; transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
.boot-skip { position: absolute; bottom: 36px; font-size: 12px; color: rgba(255,255,255,.3); animation: fadeIn 1s 1s both; }
@keyframes bootIn { from { opacity: 0; transform: scale(.88); } }
@keyframes fadeIn { from { opacity: 0; } }

/* ---------- Écran verrouillé (sans flou d'arrière-plan) ---------- */
.lock { position: fixed; inset: 0; z-index: 8000; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 8vh 20px 9vh; color: #fff; background: radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.08), transparent 60%), rgba(6,8,20,.32); transition: opacity .6s var(--out), transform .6s var(--out), visibility .6s; cursor: pointer; }
.lock.unlocked { opacity: 0; visibility: hidden; transform: scale(1.04); pointer-events: none; }
.lock-top { text-align: center; text-shadow: 0 2px 20px rgba(0,0,0,.2); }
.lock-date { font-size: 21px; font-weight: 600; opacity: .92; }
.lock-time { font-size: clamp(86px, 15vw, 156px); font-weight: 700; letter-spacing: -.04em; line-height: 1; margin-top: 4px; color: rgba(255,255,255,.92); font-variant-numeric: tabular-nums; }
.lock-user { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.avatar { width: 76px; height: 76px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.12)); border: 1px solid rgba(255,255,255,.4); box-shadow: 0 10px 30px rgba(0,0,0,.25); font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.avatar img, .wp-av img, .ct-av img, .m-av img, .n-av img, .ks-av img { width: 100%; height: 100%; object-fit: cover; }
.lock-name { font-size: 17px; font-weight: 600; }
.lock-input { display: flex; align-items: center; justify-content: space-between; width: 210px; height: 34px; padding: 0 5px 0 14px; border-radius: 999px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.3); cursor: pointer; transition: background .2s, transform .3s var(--spring); }
.lock-input:hover { background: rgba(255,255,255,.28); transform: scale(1.03); }
.lock-dots { display: flex; gap: 5px; }
.lock-dots i { width: 6px; height: 6px; border-radius: 50%; background: #fff; opacity: .85; }
.lock.logging .lock-dots i { animation: dotIn .5s calc(var(--k, 0) * 55ms) both; }
.lock-dots i:nth-child(2) { --k: 1; } .lock-dots i:nth-child(3) { --k: 2; } .lock-dots i:nth-child(4) { --k: 3; } .lock-dots i:nth-child(5) { --k: 4; } .lock-dots i:nth-child(6) { --k: 5; } .lock-dots i:nth-child(7) { --k: 6; } .lock-dots i:nth-child(8) { --k: 7; }
@keyframes dotIn { from { opacity: 0; transform: scale(.3); } }
.lock-go { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.3); }
.lock-go svg { width: 14px; height: 14px; }
.lock-hint { font-size: 12.5px; opacity: .65; }

/* ---------- Bureau & fond d'écran statique ---------- */
.desktop { position: fixed; inset: 0; overflow: hidden; }
.wallpaper { position: absolute; inset: 0; overflow: hidden; background-color: var(--wp); background-size: cover; background-position: center; }
.desktop[data-wp="aurore"] .wallpaper { --wp: #0b1028; background-image: radial-gradient(60% 70% at 8% 0%, #6a5cffcc, transparent 70%), radial-gradient(55% 60% at 100% 100%, #ff6a3dcc, transparent 70%), radial-gradient(40% 45% at 82% 6%, #00b8ff99, transparent 70%), radial-gradient(38% 42% at 24% 100%, #ff3d9a88, transparent 70%); }
.desktop[data-wp="lagon"] .wallpaper { --wp: #03141f; background-image: radial-gradient(60% 70% at 8% 0%, #00b3a4cc, transparent 70%), radial-gradient(55% 60% at 100% 100%, #0a6cffcc, transparent 70%), radial-gradient(40% 45% at 82% 6%, #5ef0d099, transparent 70%), radial-gradient(38% 42% at 24% 100%, #3b2cff88, transparent 70%); }
.desktop[data-wp="crepuscule"] .wallpaper { --wp: #1a0b1c; background-image: radial-gradient(60% 70% at 8% 0%, #ff8a3dcc, transparent 70%), radial-gradient(55% 60% at 100% 100%, #ff3d6ecc, transparent 70%), radial-gradient(40% 45% at 82% 6%, #7b3dff99, transparent 70%), radial-gradient(38% 42% at 24% 100%, #ffcc4d77, transparent 70%); }
.wallpaper.has-img { background-image: none; }
.wallpaper.has-img .waves { display: none; }
.waves { position: absolute; inset: 0; width: 100%; height: 100%; }
.dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 9500; transition: opacity .2s; }

/* entrée en scène du bureau */
.menubar, .dock-wrap, .dicon, .wg, .sticky, .pola { opacity: 0; }
.desktop.ready .menubar { animation: mbIn .6s .1s var(--out) both; }
.desktop.ready .dock-wrap { animation: dockIn .8s .2s var(--spring) both; }
.desktop.ready .pola { animation: polaIn .7s calc(.5s + var(--i) * 90ms) var(--out) both; }
.desktop.ready .dicon { animation: iconIn .5s calc(.35s + var(--i) * 50ms) var(--spring) both; }
.desktop.ready .wg { animation: wgIn .6s calc(.25s + var(--i) * 70ms) var(--out) both; }
.desktop.ready .sticky { animation: stIn .7s .8s var(--spring) both; }
@keyframes mbIn { from { opacity: 0; transform: translateY(-100%); } to { opacity: 1; transform: none; } }
@keyframes dockIn { from { opacity: 0; transform: translateY(130%); } to { opacity: 1; transform: none; } }
@keyframes iconIn { from { opacity: 0; transform: translateY(-12px) scale(.75); } to { opacity: 1; transform: none; } }
@keyframes polaIn { from { opacity: 0; transform: translateY(-30px) rotate(calc(var(--r) * 3)) scale(1.06); } to { opacity: 1; transform: rotate(var(--r)); } }
@keyframes wgIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
@keyframes stIn { from { opacity: 0; transform: translateY(-16px) rotate(-6deg); } to { opacity: 1; transform: rotate(-1.5deg); } }

/* ---------- Barre de menus ---------- */
.menubar { position: absolute; top: 0; left: 0; right: 0; height: var(--mb); z-index: 5000; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; color: #fff; font-size: 13px; font-weight: 500; text-shadow: 0 1px 6px rgba(0,0,0,.25); background: rgba(10,12,24,.28); -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%); }
.mb-left, .mb-right { display: flex; align-items: center; gap: 1px; min-width: 0; }
.mb-item { height: 22px; padding: 0 9px; border-radius: 5px; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
button.mb-item:hover, .mb-item.open { background: rgba(255,255,255,.2); }
.mb-brand { padding: 0 8px; } .mb-brand svg { width: 18px; height: 18px; }
.mb-app { font-weight: 700; }
.mb-page { position: relative; }
.mb-page.active { background: rgba(255,255,255,.22); }
.mb-ic svg { width: 16px; height: 16px; }
.mb-batt { gap: 5px; font-size: 12px; } .mb-batt svg { width: 24px; height: 12px; }
.mb-rec { gap: 5px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; }
.mb-rec i { width: 8px; height: 8px; border-radius: 50%; background: #ff453a; animation: rec 1.6s steps(2, jump-none) infinite; }
@keyframes rec { 50% { opacity: .25; } }
.mb-clock { font-variant-numeric: tabular-nums; white-space: pre; }

/* ---------- Menus ---------- */
.menu { position: absolute; z-index: 6000; min-width: 230px; padding: 5px; border-radius: 10px; color: var(--text); font-size: 13px; transform-origin: top left; animation: menuIn .14s var(--out); text-shadow: none; }
.menu.out { animation: menuOut .12s ease forwards; }
@keyframes menuIn { from { opacity: 0; transform: scale(.97) translateY(-3px); } }
@keyframes menuOut { to { opacity: 0; } }
.menu-item { display: flex; align-items: center; justify-content: space-between; gap: 20px; height: 24px; padding: 0 10px 0 4px; border-radius: 5px; }
.menu-item:hover { background: var(--accent); color: #fff; }
.menu-item.disabled { opacity: .38; pointer-events: none; }
.mi-l { display: flex; align-items: center; }
.mi-check { width: 18px; font-style: normal; font-size: 12px; text-align: center; }
.menu-item kbd { font-family: var(--font); font-size: 12.5px; opacity: .5; }
.menu-sep { height: 1px; margin: 4px 8px; background: var(--line); }

/* ---------- Icônes du bureau ---------- */
.desk-icons { position: absolute; inset: var(--mb) 0 0 0; z-index: 10; touch-action: manipulation; }
.dicon { position: absolute; width: 112px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px; border-radius: 8px; text-align: center; touch-action: none; }
.dicon .ico { width: 62px; height: 62px; padding: 2px; border-radius: 9px; filter: drop-shadow(0 4px 6px rgba(0,0,0,.28)); transition: transform .25s var(--spring); }
.dicon .ico svg { width: 100%; height: 100%; }
.dicon:hover .ico { transform: translateY(-2px); }
.dicon .lbl { font-size: 11.5px; font-weight: 600; line-height: 1.3; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.75); padding: 1px 5px; border-radius: 4px; max-width: 108px; overflow-wrap: anywhere; }
.dicon.selected .ico { background: rgba(255,255,255,.18); box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.dicon.selected .lbl { background: var(--sel); text-shadow: none; }
.dicon.dragging { opacity: .82; z-index: 2; will-change: transform; }
.dicon.launch .ico { animation: pop .45s var(--spring); }
@keyframes pop { 40% { transform: scale(.86); } 70% { transform: scale(1.1); } }
.select-rect { position: absolute; z-index: 11; display: none; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.12); border-radius: 3px; pointer-events: none; }

/* ---------- Widgets ---------- */
.widgets { position: absolute; z-index: 12; left: 22px; top: calc(var(--mb) + 18px); width: 344px; display: grid; grid-template-columns: 164px 164px; grid-auto-rows: 164px; gap: 16px; }
.wg { position: relative; overflow: hidden; border-radius: 22px; color: #fff; text-align: left; background: rgba(22,22,30,.5); border: 1px solid rgba(255,255,255,.14); box-shadow: 0 10px 30px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.12); contain: layout paint; }
html[data-theme="light"] .wg:not(.wg-notes) { background: rgba(255,255,255,.72); color: #1d1d1f; border-color: rgba(255,255,255,.7); }
button.wg { cursor: pointer; transition: transform .25s var(--spring); }
button.wg:hover { transform: scale(1.02); }
button.wg:active { transform: scale(.98); }
.wg-m { grid-column: span 2; }

.wg-prof { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.wp-top { display: flex; align-items: center; gap: 12px; }
.wp-av { width: 54px; height: 54px; border-radius: 50%; flex: none; overflow: hidden; display: grid; place-items: center; font-size: 19px; font-weight: 800; background: linear-gradient(135deg, #8e7bff, #ff6a8a); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.wp-id { min-width: 0; display: flex; flex-direction: column; }
.wp-id b { font-size: 16px; letter-spacing: -.01em; }
.wp-id span { font-size: 12.5px; opacity: .8; }
.wp-id small { display: flex; align-items: center; gap: 3px; font-size: 11px; opacity: .6; margin-top: 2px; }
.wp-id small svg { width: 12px; height: 12px; }
.wp-status { display: flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; opacity: .9; }
.wp-status i { width: 8px; height: 8px; border-radius: 50%; background: #30d158; box-shadow: 0 0 0 3px rgba(48,209,88,.25); flex: none; }
.wp-status span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wp-act { display: flex; gap: 8px; margin-top: auto; }
.wp-btn { flex: 1; height: 32px; display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.14); cursor: pointer; transition: background .15s, transform .2s var(--spring); }
html[data-theme="light"] .wp-btn { background: rgba(0,0,0,.06); }
.wp-btn:hover { background: rgba(255,255,255,.24); }
.wp-btn:active { transform: scale(.96); }
.wp-btn.primary { background: #0a84ff; color: #fff; }
.wp-btn.primary:hover { background: #2a95ff; }

/* tirages photo posés sur le bureau (photos de moi au travail) */
.polas { position: absolute; inset: 0; z-index: 11; pointer-events: none; }

.pola:hover { box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 22px 44px rgba(0,0,0,.4); }
.pola.dragging { z-index: 50 !important; will-change: transform; cursor: grabbing; }
.pola:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.pola-img { aspect-ratio: 1; overflow: hidden; background: #1c1c1e; }
.pola-img img { width: 100%; height: 100%; object-fit: cover; }
.pola-ph { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: rgba(255,255,255,.55); background: repeating-linear-gradient(135deg, #26262a 0 10px, #2d2d32 10px 20px); }

/* pense-bête (Stickies) */
.sticky { position: absolute; z-index: 12; left: 392px; top: calc(var(--mb) + 26px); width: 214px; padding: 0 16px 14px; background: linear-gradient(180deg, #fff7a8, #fdec6f); color: #3b3104; font-family: "Marker Felt", "Comic Sans MS", "Segoe Print", var(--font); font-size: 14.5px; line-height: 1.35; box-shadow: 0 14px 30px rgba(0,0,0,.28); transform: rotate(-1.5deg); border-radius: 2px; }
.sticky p + p { margin-top: 7px; }
.sticky a { text-decoration: underline; color: #0b5bd3; }
.st-bar { height: 20px; margin: 0 -16px 8px; background: rgba(0,0,0,.06); display: flex; align-items: center; padding: 0 6px; cursor: grab; touch-action: none; }
.st-x { width: 12px; height: 12px; display: grid; place-items: center; border: 1px solid rgba(0,0,0,.3); background: rgba(255,255,255,.4); cursor: pointer; }
.st-x svg { width: 8px; height: 8px; }
.st-sign { text-align: right; font-size: 15px; }

/* ---------- Dock ---------- */
.dock-wrap { position: absolute; left: 0; right: 0; bottom: 6px; z-index: 4000; display: flex; justify-content: center; pointer-events: none; }
.dock { position: relative; pointer-events: auto; display: flex; align-items: flex-end; gap: 5px; height: 68px; padding: 8px 9px; border-radius: 22px; }
.dock-item { position: relative; width: var(--s, 50px); height: var(--s, 50px); flex: none; display: flex; align-items: flex-end; justify-content: center; transition: width .1s ease-out, height .1s ease-out; cursor: pointer; }
.dock-item .ico { width: 100%; height: 100%; filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)); }
.dock-item .ico svg { width: 100%; height: 100%; }
.dock-item:active .ico { filter: drop-shadow(0 3px 5px rgba(0,0,0,.3)) brightness(.7); }
.dock-item .dot { position: absolute; bottom: -6px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: rgba(255,255,255,.9); opacity: 0; transition: opacity .3s; }
html[data-theme="light"] .dock-item .dot { background: rgba(0,0,0,.7); }
.dock-item.running .dot { opacity: 1; }
.dock-item .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translate(-50%, 4px); white-space: nowrap; padding: 4px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 500; color: var(--text); background: var(--bar-bg); border: 1px solid var(--win-border); box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: .15s var(--out); }
.dock-item:hover .tip { opacity: 1; transform: translate(-50%, 0); }
.dock-item.bounce .ico { animation: bounce .7s ease infinite; }
@keyframes bounce { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-22px); } 55% { transform: translateY(0); } 72% { transform: translateY(-6px); } 86% { transform: translateY(0); } }
.dock-sep { width: 1px; height: 44px; align-self: center; margin: 0 4px; background: rgba(255,255,255,.28); }
html[data-theme="light"] .dock-sep { background: rgba(0,0,0,.18); }

/* ---------- Notifications ---------- */
.notif-stack { position: absolute; top: calc(var(--mb) + 10px); right: 12px; z-index: 6500; display: flex; flex-direction: column; gap: 10px; width: min(350px, calc(100vw - 24px)); pointer-events: none; }
.notif { position: relative; overflow: hidden; display: flex; gap: 11px; padding: 11px 32px 13px 11px; border-radius: 18px; color: var(--text); pointer-events: auto; cursor: pointer; animation: notifIn .5s var(--spring); }
.notif.out { animation: notifOut .38s var(--out) forwards; }
@keyframes notifIn { from { opacity: 0; transform: translateX(110%); } }
@keyframes notifOut { to { opacity: 0; transform: translateX(110%); } }
.n-ico { width: 38px; height: 38px; flex: none; } .n-ico svg { width: 100%; height: 100%; }
.n-txt { min-width: 0; }
.n-head { display: flex; justify-content: space-between; gap: 10px; font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.n-head span { text-transform: none; letter-spacing: 0; }
.n-title { font-size: 13px; font-weight: 700; margin-top: 2px; }
.n-body { font-size: 12.5px; color: var(--text-2); line-height: 1.35; margin-top: 1px; }
.n-x { position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); opacity: 0; transition: opacity .2s; cursor: pointer; }
.n-x svg { width: 11px; height: 11px; }
.notif:hover .n-x { opacity: 1; }
.n-timer { position: absolute; left: 14px; right: 14px; bottom: 5px; height: 2px; border-radius: 2px; background: var(--accent); transform-origin: left; animation: timer linear forwards; opacity: .7; }
.notif:hover .n-timer { animation-play-state: paused; }
@keyframes timer { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* ---------- Écrans de démarrage des logiciels ---------- */
.splash { position: absolute; left: 50%; top: 45%; z-index: 6800; width: min(520px, 90vw); height: 300px; padding: 28px; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; gap: 6px; color: #fff; transform: translate(-50%, -50%); box-shadow: 0 30px 80px rgba(0,0,0,.55); animation: splashIn .35s var(--out); }
.splash.out { animation: splashOut .3s var(--out) forwards; }
@keyframes splashIn { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } }
@keyframes splashOut { to { opacity: 0; } }
.splash > * { position: relative; }
.sp-art { position: absolute; inset: 0; }
.sp-logo { width: 54px; height: 54px; } .sp-logo svg { width: 100%; height: 100%; }
.sp-name { font-size: 22px; font-weight: 700; letter-spacing: -.01em; margin-top: 8px; }
.sp-status { font-size: 12px; opacity: .7; margin-top: auto; height: 16px; }
.sp-bar { height: 3px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
.sp-bar i { display: block; height: 100%; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .2s ease; }
.sp-legal { font-size: 10px; opacity: .45; }
.sp-adobe.sp-ae { background: #00005b; } .sp-adobe.sp-ae .sp-art { background: radial-gradient(80% 90% at 85% 20%, #9999ff88, transparent 60%), radial-gradient(70% 80% at 70% 100%, #d291ff66, transparent 60%), linear-gradient(135deg, #00005b, #1b0a5e); }
.sp-adobe.sp-ae .sp-bar i { color: #9999ff; }
.sp-adobe.sp-ps { background: #001e36; } .sp-adobe.sp-ps .sp-art { background: radial-gradient(80% 90% at 85% 20%, #31a8ff88, transparent 60%), radial-gradient(70% 80% at 70% 100%, #00e0ff55, transparent 60%), linear-gradient(135deg, #001e36, #002b52); }
.sp-adobe.sp-ps .sp-bar i { color: #31a8ff; }
.sp-resolve { background: #17181b; align-items: center; justify-content: center; text-align: center; }
.sp-resolve .sp-art { background: radial-gradient(60% 70% at 50% 30%, #2d3038, transparent 70%); }
.sp-resolve .sp-logo { width: 84px; height: 84px; }
.sp-resolve .sp-status, .sp-resolve .sp-bar { width: 70%; margin-top: 18px; } .sp-resolve .sp-status { margin-top: 26px; }
.sp-resolve .sp-bar i { color: #f2f2f2; }
.sp-canva { background: linear-gradient(135deg, #00c4cc, #7d2ae8); align-items: center; justify-content: center; text-align: center; }
.sp-canva .sp-logo { width: 90px; height: 90px; }
.sp-canva .sp-status, .sp-canva .sp-bar { width: 60%; }

/* ---------- Centre de contrôle ---------- */
.cc { position: absolute; z-index: 6600; top: calc(var(--mb) + 6px); right: 8px; width: 316px; padding: 12px; border-radius: 22px; display: flex; flex-direction: column; gap: 10px; color: var(--text); opacity: 0; visibility: hidden; transform: scale(.97) translateY(-6px); transform-origin: top right; transition: .2s var(--out); }
.cc.open { opacity: 1; visibility: visible; transform: none; }
.cc-row { display: grid; grid-template-columns: 1.15fr 1fr; gap: 10px; }
.cc-tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
.cc-net { display: flex; flex-direction: column; gap: 8px; }
.cc-round { display: flex; align-items: center; gap: 8px; text-align: left; cursor: pointer; }
.cc-round svg { width: 28px; height: 28px; padding: 6px; border-radius: 50%; background: var(--panel-2); flex: none; }
.cc-round.on svg { background: var(--accent); color: #fff; }
.cc-round b { display: block; font-size: 12px; } .cc-round small { font-size: 11px; color: var(--text-2); }
.cc-col { display: flex; flex-direction: column; gap: 10px; }
.cc-toggle { flex: 1; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 6px; text-align: left; cursor: pointer; font-size: 12px; }
.cc-ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); }
.cc-ic svg { width: 15px; height: 15px; }
.cc-toggle.on .cc-ic { background: var(--accent); color: #fff; }
.cc-slider b, .cc-wp b { display: block; font-size: 12px; margin-bottom: 7px; }
.slider { position: relative; display: flex; align-items: center; height: 24px; }
.slider svg { position: absolute; left: 7px; width: 14px; height: 14px; color: #444; z-index: 1; pointer-events: none; }
.slider input { width: 100%; height: 24px; -webkit-appearance: none; appearance: none; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden; cursor: pointer; }
html[data-theme="light"] .slider input { background: rgba(0,0,0,.08); }
.slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: -400px 0 0 388px #fff, 0 1px 4px rgba(0,0,0,.3); }
.slider input::-moz-range-thumb { width: 24px; height: 24px; border: 0; border-radius: 50%; background: #fff; }
.slider input::-moz-range-progress { height: 24px; background: #fff; }
.cc-swatches { display: flex; gap: 8px; }
.sw { flex: 1; height: 42px; border-radius: 10px; display: flex; align-items: flex-end; padding: 5px 7px; font-size: 10.5px; font-weight: 600; color: #fff; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.sw.on { box-shadow: 0 0 0 2px var(--accent), inset 0 0 0 1px rgba(255,255,255,.3); }
.sw-aurore { background: radial-gradient(circle at 20% 20%, #6a5cff, transparent 60%), radial-gradient(circle at 80% 90%, #ff6a3d, transparent 60%), #0b1028; }
.sw-lagon { background: radial-gradient(circle at 20% 20%, #00b3a4, transparent 60%), radial-gradient(circle at 80% 90%, #0a6cff, transparent 60%), #03141f; }
.sw-crepuscule { background: radial-gradient(circle at 20% 20%, #ff8a3d, transparent 60%), radial-gradient(circle at 80% 90%, #7b3dff, transparent 60%), #1a0b1c; }
.cc-now { display: flex; align-items: center; gap: 10px; }
.cc-art { width: 42px; height: 42px; border-radius: 9px; overflow: hidden; flex: none; }
.cc-nowt { flex: 1; min-width: 0; } .cc-nowt b { display: block; font-size: 13px; } .cc-nowt small { font-size: 11.5px; color: var(--text-2); }
.cc-play { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); cursor: pointer; }
.cc-play svg { width: 14px; height: 14px; }

/* ---------- Spotlight ---------- */
.spotlight { position: absolute; inset: 0; z-index: 7000; display: none; justify-content: center; align-items: flex-start; padding: 16vh 16px 0; }
.spotlight.open { display: flex; }
.sp-box { width: min(640px, 100%); border-radius: 22px; overflow: hidden; color: var(--text); animation: spIn .25s var(--spring); }
@keyframes spIn { from { opacity: 0; transform: scale(.96) translateY(-8px); } }
.sp-input { display: flex; align-items: center; gap: 12px; padding: 14px 18px; }
.sp-ico svg { width: 22px; height: 22px; opacity: .6; }
.sp-input input { flex: 1; border: 0; outline: 0; background: none; font-size: 21px; }
.sp-input input::placeholder { color: var(--text-3); }
.sp-results { border-top: 1px solid var(--line); max-height: 52vh; overflow: auto; padding: 6px; }
.sp-h { padding: 6px 10px 4px; font-size: 11px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: .06em; }
.sp-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: 10px; text-align: left; cursor: pointer; }
.sp-row.active { background: var(--accent); color: #fff; }
.sp-ri { width: 30px; height: 30px; flex: none; display: grid; place-items: center; }
.sp-ri > svg { width: 100%; height: 100%; }
.sp-ri > svg[stroke] { width: 20px; height: 20px; }
.sp-rl { flex: 1; min-width: 0; } .sp-rl b { display: block; font-size: 14px; font-weight: 600; } .sp-rl small { font-size: 12px; opacity: .65; }
.sp-row kbd { font-family: var(--font); opacity: 0; } .sp-row.active kbd { opacity: .8; }
.sp-empty { padding: 18px; text-align: center; color: var(--text-2); }

/* ==================================================================
   FENÊTRES (opaques : pas de flou d'arrière-plan = fluide)
   ================================================================== */
.windows { position: absolute; inset: 0; z-index: 100; pointer-events: none; }
.win { position: absolute; pointer-events: auto; display: flex; flex-direction: column; border-radius: var(--rw); overflow: hidden; color: var(--text); background: var(--win-bg); border: 1px solid var(--win-border); box-shadow: 0 0 0 .5px rgba(0,0,0,.45), 0 22px 56px rgba(0,0,0,.42), 0 6px 16px rgba(0,0,0,.2); contain: layout paint style; }
.win:not(.focused) { box-shadow: 0 0 0 .5px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.26); }
.win:not(.focused) .tl button { background: rgba(140,140,150,.45) !important; box-shadow: none; }
.win:not(.focused) .tl svg { display: none; }
.win.dragging, .win.resizing { will-change: transform; }
.win.dragging iframe, .win.resizing iframe { pointer-events: none; }
.win.anim-geom { transition: left .4s var(--out), top .4s var(--out), width .4s var(--out), height .4s var(--out); }
.win.maxed { border-radius: 10px; }
.win-titlebar { position: relative; height: 30px; flex: none; display: flex; align-items: center; padding: 0 12px; background: var(--bar-bg); border-bottom: 1px solid var(--line); touch-action: none; }
.tl { position: relative; z-index: 2; display: flex; gap: 8px; flex: none; }
.tl button { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.25); }
.tl .c { background: #ff5f57; } .tl .m { background: #febc2e; } .tl .f { background: #28c840; }
.tl svg { width: 8px; height: 8px; opacity: 0; }
.tl:hover svg { opacity: 1; }
.tl button:active { filter: brightness(.8); }
.win-title { position: absolute; left: 50%; transform: translateX(-50%); max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; color: var(--text-2); pointer-events: none; }
.win.focused .win-title { color: var(--text); }
.win-body { position: relative; flex: 1; min-height: 0; display: flex; }
.win-body > * { flex: 1; min-width: 0; }
.win-resize { position: absolute; right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; z-index: 30; touch-action: none; }
.tl-slot { display: flex; align-items: center; flex: none; }

/* variantes */
.win-dark { --text: #f5f5f7; --text-2: rgba(245,245,247,.66); --text-3: rgba(245,245,247,.42); --panel: rgba(255,255,255,.05); --panel-2: rgba(255,255,255,.1); --line: rgba(255,255,255,.08); --hover: rgba(255,255,255,.08); --field: rgba(255,255,255,.07); --bar-bg: #2a2a2c; --win-bg: #1c1c1e; --side-bg: #262628; background: var(--win-bg); border-color: rgba(255,255,255,.12); }
.win-light { --text: #1d1d1f; --text-2: rgba(29,29,31,.62); --text-3: rgba(29,29,31,.42); --panel: rgba(0,0,0,.035); --panel-2: rgba(0,0,0,.07); --line: rgba(0,0,0,.09); --hover: rgba(0,0,0,.05); --field: rgba(0,0,0,.05); --bar-bg: #f6f6f6; --win-bg: #fff; --side-bg: #ebebed; background: var(--win-bg); border-color: rgba(0,0,0,.18); }

/* ---------- Affiches générées ---------- */
.poster { position: relative; width: 100%; height: 100%; overflow: hidden; container-type: inline-size; background: radial-gradient(120% 90% at 15% 10%, var(--c1), transparent 60%), linear-gradient(135deg, var(--c1), var(--c2)); }
.poster.has-img { background: #111; }
.poster.has-img img { width: 100%; height: 100%; object-fit: cover; }
.po-orb { position: absolute; width: 70%; aspect-ratio: 1; right: -18%; top: -30%; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.38), transparent 62%); }
.po-txt { position: absolute; left: 7%; right: 7%; bottom: 13%; color: #fff; font-weight: 800; font-size: 26px; font-size: clamp(10px, 11cqw, 72px); line-height: .95; letter-spacing: -.03em; text-transform: uppercase; text-shadow: 0 2px 16px rgba(0,0,0,.25); overflow-wrap: anywhere; }
.po-sub { position: absolute; left: 7%; bottom: 6%; color: rgba(255,255,255,.75); font-size: 11px; font-size: clamp(6px, 4cqw, 15px); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }

/* ---------- Responsive ---------- */
@media (max-height: 560px) { .widgets > :nth-child(n+3) { display: none; } }
@media (max-width: 1180px) { .sticky { display: none; } }
@media (max-width: 960px) { .widgets > :nth-child(n+3) { display: none; } }
@media (max-width: 760px) {
  .mb-menu, .mb-hide { display: none; }
  .mb-app { display: none; }
  .menubar { font-size: 13px; padding: 0 4px; }
  .mb-item { padding: 0 7px; }
  .win { left: 6px !important; top: calc(var(--mb) + 6px) !important; width: calc(100vw - 12px) !important; height: calc(100% - var(--mb) - 90px) !important; }
  .win-resize { display: none; }
  .widgets { left: 10px; right: 10px; top: calc(var(--mb) + 10px); width: auto; grid-template-columns: 1fr; grid-auto-rows: auto; gap: 10px; }
  .widgets > :nth-child(n+2) { display: none; }
  .wg-m { grid-column: auto; }
  .wg-prof { padding: 12px 14px; }
  .dock-wrap { bottom: 6px; padding: 0 6px; }
  .dock { height: 58px; gap: 3px; padding: 7px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .dock::-webkit-scrollbar { display: none; }
  .dock-item { --s: 40px !important; }
  .dock-item .tip { display: none; }
  .dock-sep { height: 34px; margin: 0 2px; }
  .dicon { width: 84px; } .dicon .lbl { max-width: 82px; font-size: 11px; } .dicon .ico { width: 52px; height: 52px; }
  .notif-stack { right: 6px; width: calc(100vw - 12px); }
  .cc { right: 6px; left: 6px; width: auto; }
  .splash { height: 240px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
@media print {

/* animation de composition (projets sans vidéo) */
.ca { position: absolute; inset: 0; overflow: hidden; background: #0b0b14; }
.ca * { animation-play-state: paused !important; }
.ca-bg { position: absolute; inset: 0; background: radial-gradient(80% 90% at 20% 20%, var(--c1), transparent 60%), radial-gradient(70% 80% at 85% 85%, var(--c2), transparent 60%), #0b0b14; opacity: .85; }
.ca-ring { position: absolute; left: 50%; top: 50%; width: 46%; aspect-ratio: 1; margin: -23% 0 0 -23%; border-radius: 50%; border: 2px dashed rgba(255,255,255,.35); animation: caSpin 6s linear infinite; animation-delay: var(--t); }
.ca-circle { position: absolute; left: 50%; top: 50%; width: 26%; aspect-ratio: 1; margin: -13% 0 0 -13%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--c1) 60%, var(--c2)); animation: caPop 6s cubic-bezier(.2,.9,.3,1.2) infinite; animation-delay: var(--t); }
.ca-bar { position: absolute; left: 18%; right: 18%; bottom: 26%; height: 4px; border-radius: 2px; background: #fff; transform-origin: left; animation: caBar 6s cubic-bezier(.7,0,.2,1) infinite; animation-delay: var(--t); }
.ca-title { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); display: flex; justify-content: center; font-weight: 900; font-size: 40px; font-size: clamp(18px, 7cqw, 64px); letter-spacing: .02em; color: #fff; container-type: normal; }
.ae-frame, .rv-frame { container-type: inline-size; }
.ca-title span { display: inline-block; animation: caLetter 6s cubic-bezier(.2,.9,.3,1.2) infinite; animation-delay: calc(var(--t) + var(--i) * 60ms); }
.ca-sub { position: absolute; left: 0; right: 0; bottom: 16%; text-align: center; font-size: 12px; font-size: clamp(9px, 2.2cqw, 18px); letter-spacing: .3em; text-transform: uppercase; color: rgba(255,255,255,.8); animation: caFade 6s ease infinite; animation-delay: var(--t); }
.ca-parts i { position: absolute; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: 0; animation: caPart 6s ease-out infinite; animation-delay: calc(var(--t) + var(--d)); }
@keyframes caSpin { to { transform: rotate(360deg); } }
@keyframes caPop { 0% { transform: scale(0); } 18%, 80% { transform: scale(1); } 100% { transform: scale(0); } }
@keyframes caBar { 0%, 20% { transform: scaleX(0); } 45%, 85% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes caLetter { 0%, 12% { opacity: 0; transform: translateY(60%); } 28%, 86% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-40%); } }
@keyframes caFade { 0%, 35% { opacity: 0; } 50%, 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes caPart { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: .9; } 100% { opacity: 0; transform: translateY(-30px) scale(1.4); } }

.cva { display: flex; flex-direction: column; min-height: 0; background: #ebecf0; color: #0e1318; font-size: 13px; }

.cva-top .tl-slot { margin-right: 10px; }

.cva-hb svg { width: 16px; height: 16px; }
.cva-ur { display: flex; gap: 10px; padding: 0 6px; opacity: .9; } .cva-ur svg { width: 18px; height: 18px; }
.cva-sp { flex: 1; }

.cva-share svg { width: 16px; height: 16px; }
.cva-main { flex: 1; min-height: 0; display: flex; }
.cva-rail { width: 72px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; background: #fff; border-right: 1px solid #e3e5e8; overflow: hidden; }
.cva-rail button { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 10.5px; color: #3b4148; cursor: pointer; }
.cva-rail button span { width: 40px; height: 32px; display: grid; place-items: center; border-radius: 8px; }
.cva-rail button svg { width: 20px; height: 20px; }

.cva-rail button.on { color: #0e1318; font-weight: 600; } .cva-rail button.on span { background: #e8e2fd; color: #7d2ae8; }
.cva-panel { width: 300px; flex: none; overflow: auto; padding: 14px; background: #fff; border-right: 1px solid #e3e5e8; display: flex; flex-direction: column; gap: 12px; }
.cva-search { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 8px; border: 1px solid #d5d8dd; }
.cva-search svg { width: 17px; height: 17px; opacity: .55; } .cva-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 13.5px; }
.cva-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.cva-chips button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid #d5d8dd; font-size: 12.5px; cursor: pointer; }
.cva-chips button.on { background: #0e1318; color: #fff; border-color: #0e1318; }
.cva-ab { padding: 12px; border-radius: 10px; background: #f4f0ff; display: flex; flex-direction: column; gap: 5px; }
.cva-ab b { font-size: 14px; } .cva-ab small { color: #5e6670; font-size: 11.5px; } .cva-ab p { font-size: 12.5px; line-height: 1.5; color: #3b4148; }
.cva-tags { display: flex; flex-wrap: wrap; gap: 4px; } .cva-tags span { padding: 2px 8px; border-radius: 999px; background: #fff; font-size: 11px; color: #7d2ae8; }
.cva-h { font-weight: 700; font-size: 14px; }
.cva-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
.cva-card { display: flex; flex-direction: column; gap: 4px; text-align: left; cursor: pointer; min-width: 0; }
.cva-th { border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #e3e5e8; aspect-ratio: 3 / 4; }
.cva-th.fmt-miniature { aspect-ratio: 16 / 9; } .cva-th.fmt-post { aspect-ratio: 1; } .cva-th.fmt-story { aspect-ratio: 9 / 16; }
.cva-card.on .cva-th { box-shadow: 0 0 0 2px #8b3dff; }
.cva-card b { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cva-card small { font-size: 11px; color: #6b7280; }
.cva-empty { color: #6b7280; grid-column: 1 / -1; }
.cva-stage { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cva-ctx { flex: none; height: 44px; display: flex; align-items: center; gap: 4px; padding: 0 12px; background: #fff; border-bottom: 1px solid #e3e5e8; white-space: nowrap; overflow: hidden; }
.cva-ctx span { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 6px; font-weight: 500; }
.cva-ctx span svg { width: 16px; height: 16px; }
.cva-ctx .sp { flex: 1; }
.cva-canvas { flex: 1; min-height: 0; overflow: auto; padding: 22px 30px 30px; }
.cva-pages { display: flex; flex-direction: column; align-items: center; gap: 22px; }
.cva-pw { width: min(100%, 520px); display: flex; flex-direction: column; gap: 8px; }
.cva-ptitle { font-size: 12.5px; color: #3b4148; } .cva-ptitle b { font-weight: 600; }
.cva-page { width: 100%; aspect-ratio: 3 / 4; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.12); overflow: hidden; }
.cva-page.fmt-miniature { aspect-ratio: 16 / 9; } .cva-page.fmt-post { aspect-ratio: 1; } .cva-page.fmt-story { aspect-ratio: 9 / 16; width: min(100%, 300px); align-self: center; }
.cva-page img, .cva-page .poster { width: 100%; height: 100%; object-fit: cover; }
.cva-add { width: min(100%, 520px); height: 40px; border-radius: 8px; background: #fff; border: 1px solid #d5d8dd; font-weight: 600; color: #3b4148; cursor: pointer; }
.cva-foot { flex: none; height: 38px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: #fff; border-top: 1px solid #e3e5e8; font-size: 12.5px; color: #3b4148; white-space: nowrap; overflow: hidden; }
.cva-foot span { display: flex; align-items: center; gap: 5px; }
.cva-foot svg { width: 16px; height: 16px; }
.cva-foot .sp { flex: 1; }
.cva-zoom i { width: 100px; height: 4px; border-radius: 2px; background: #d5d8dd; position: relative; }
.cva-zoom i b { position: absolute; left: 30%; top: -5px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #b5b9bf; }
.cva-zoom em { font-style: normal; }

/* ==================================================================
   CONTACT
   ================================================================== */
.win-contact { --ct-card: var(--side-bg); }
.ct { display: grid; grid-template-columns: 330px minmax(0, 1fr); min-height: 0; }
.ct-card { overflow: auto; padding: 22px 20px; background: var(--ct-card); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.ct-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.ct-av { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; background: linear-gradient(180deg, #a5a9b4, #7c818c); margin-bottom: 6px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.ct-head h2 { font-size: 22px; letter-spacing: -.01em; }
.ct-head p { color: var(--text-2); }
.ct-status { display: flex; align-items: center; gap: 6px; margin-top: 4px; padding: 3px 10px; border-radius: 999px; background: rgba(48,209,88,.14); color: #1f9d48; font-size: 11.5px; font-weight: 600; }
html[data-theme="dark"] .ct-status { color: #5ce37f; }
.ct-status i { width: 7px; height: 7px; border-radius: 50%; background: #30d158; }
.ct-acts { display: flex; gap: 10px; margin-top: 12px; }
.ct-acts > * { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10.5px; color: var(--accent); cursor: pointer; }
.ct-acts span { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); }
.ct-acts span svg { width: 18px; height: 18px; }
.ct-acts > *:hover span { background: var(--accent); color: #fff; }
.ct-fields { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.ct-fields div { display: grid; grid-template-columns: 76px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.ct-fields dt { color: var(--text-3); text-align: right; }
.ct-mail { color: var(--accent); cursor: pointer; text-align: left; word-break: break-all; }
.ct-soc { display: flex; flex-direction: column; gap: 4px; }
.soc { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; transition: background .15s; }
.soc:hover { background: var(--hover); }
.soc-l { width: 26px; height: 26px; flex: none; } .soc-l svg { width: 100%; height: 100%; }
.soc > span:nth-child(2) { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.soc b { font-size: 12.5px; } .soc small { font-size: 11.5px; color: var(--text-2); }
.soc > svg { width: 14px; height: 14px; opacity: .4; }
.ct-more { display: flex; flex-wrap: wrap; gap: 6px; }
.ct-form { position: relative; overflow: auto; padding: 24px 26px; display: flex; flex-direction: column; gap: 12px; }
.ct-form h3 { font-size: 20px; letter-spacing: -.01em; }
.ct-sub { color: var(--text-2); margin-top: -6px; }
.ct-form label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.ct-form label.grow { flex: 1; min-height: 140px; }
.ct-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ct-form input, .ct-form textarea { width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); font-size: 13.5px; font-weight: 400; color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
.ct-form textarea { flex: 1; min-height: 120px; resize: none; line-height: 1.5; }
.ct-form input:focus, .ct-form textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(10,132,255,.2); }
.cform .err { border-color: #ff453a !important; box-shadow: 0 0 0 3px rgba(255,69,58,.2) !important; }
.ct-sugg, .mc-sugg { display: flex; flex-wrap: wrap; gap: 6px; }
.ct-sugg button, .mc-sugg button { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; }
.ct-sugg button.on, .mc-sugg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.ct-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ct-foot small { color: var(--text-3); font-size: 11.5px; }
.cf-done { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: var(--win-bg); opacity: 0; visibility: hidden; transition: opacity .3s, visibility .3s; z-index: 5; }
.cf-done b { font-size: 18px; } .cf-done small { color: var(--text-2); }
.cf-plane { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; margin-bottom: 6px; }
.cf-plane svg { width: 26px; height: 26px; }
.cform.sent .cf-done { opacity: 1; visibility: visible; }
.cform.sent .cf-plane { animation: plane .9s var(--out); }
@keyframes plane { 0% { transform: translate(-30px, 30px) scale(.6); opacity: 0; } 60% { transform: translate(6px, -6px) scale(1.05); opacity: 1; } 100% { transform: none; } }
.cform.sending [data-send] { opacity: .6; }
.cform.sending [data-send] svg { animation: sendFly .7s var(--out) forwards; }
@keyframes sendFly { to { transform: translate(18px, -18px); opacity: 0; } }

/* ==================================================================
   MAIL
   ================================================================== */
.ml { display: flex; min-height: 0; background: var(--win-bg); }
.ml-side { width: 190px; flex: none; display: flex; flex-direction: column; background: var(--side-bg); border-right: 1px solid var(--line); overflow: auto; padding: 0 8px 10px; }
.ml-side-top { height: 52px; flex: none; display: flex; align-items: center; padding: 0 10px; }
.ml-h { padding: 10px 8px 3px; font-size: 11px; font-weight: 700; color: var(--text-3); }
.ml-box { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; text-align: left; cursor: pointer; }
.ml-box svg { width: 16px; height: 16px; color: var(--accent); flex: none; }
.ml-box span { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ml-box em { font-style: normal; font-size: 11.5px; color: var(--text-3); }
.ml-box:hover { background: var(--hover); }
.ml-box.on { background: var(--panel-2); }
.ml-list { width: 310px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
.ml-lh { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid var(--line); }
.ml-mtl { display: none; }
.ml-lt b { display: block; font-size: 15px; } .ml-lt small { font-size: 11.5px; color: var(--text-3); }
.ml-cta { flex: none; display: flex; align-items: center; gap: 10px; margin: 10px 10px 4px; padding: 10px 12px; border-radius: 10px; text-align: left; color: #fff; background: linear-gradient(135deg, #3d9bff, #0a6cff); box-shadow: 0 4px 14px rgba(10,108,255,.3); cursor: pointer; transition: transform .2s var(--spring); }
.ml-cta:hover { transform: translateY(-1px); }
.ml-cta svg { width: 22px; height: 22px; flex: none; }
.ml-cta b { display: block; font-size: 13px; } .ml-cta small { font-size: 11px; opacity: .85; }
.ml-items { flex: 1; overflow: auto; padding: 6px 8px; }
.ml-it { position: relative; width: 100%; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 9px 20px; border-radius: 8px; text-align: left; cursor: pointer; border-bottom: 1px solid var(--line); }
.ml-it.on { background: var(--sel); color: #fff; border-color: transparent; }
.ml-dot { position: absolute; left: 6px; top: 13px; width: 8px; height: 8px; border-radius: 50%; background: transparent; }
.ml-it.unread .ml-dot { background: var(--accent); }
.ml-it.on.unread .ml-dot { background: #fff; }
.ml-r1 { display: flex; justify-content: space-between; gap: 8px; }
.ml-r1 b { font-size: 13px; } .ml-r1 span { font-size: 11.5px; opacity: .6; }
.ml-sj { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ml-pv { font-size: 12px; opacity: .6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ml-empty, .ml-none { padding: 40px 10px; text-align: center; color: var(--text-3); }
.ml-view { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.ml-tb { height: 52px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); }
.ml-tbb { width: 32px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--text-2); cursor: pointer; }
.ml-tbb svg { width: 18px; height: 18px; }
.ml-tbb:hover { background: var(--hover); color: var(--text); }
.ml-tbb.accent { color: var(--accent); }
.ml-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.ml-sp { flex: 1; }
.ml-search { display: flex; align-items: center; gap: 5px; height: 28px; width: 160px; padding: 0 9px; border-radius: 7px; background: var(--field); }
.ml-search svg { width: 14px; height: 14px; opacity: .5; } .ml-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; }
.ml-msg { flex: 1; overflow: auto; padding: 18px 26px 30px; }
.ml-mh { display: flex; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.ml-av { width: 42px; height: 42px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(180deg, #a5a9b4, #7c818c); }
.ml-av img { width: 100%; height: 100%; object-fit: cover; }
.ml-av.sm { width: 34px; height: 34px; font-size: 12px; }
.ml-mhi { flex: 1; min-width: 0; }
.ml-mhi b { font-size: 14px; } .ml-mhi small { display: block; font-size: 12px; color: var(--text-2); }
.ml-mhi h2 { font-size: 18px; margin-top: 8px; letter-spacing: -.01em; }
.ml-mt { font-size: 12px; color: var(--text-3); }
.ml-body { padding-top: 16px; font-size: 14px; line-height: 1.6; max-width: 640px; user-select: text; -webkit-user-select: text; }
.ml-body p + p { margin-top: 10px; }
.ml-body a { color: var(--accent); cursor: pointer; text-decoration: underline; }
.ml-ctas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.ml-sig { display: flex; align-items: center; gap: 10px; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); }
.ml-sig b { display: block; font-size: 13px; } .ml-sig small { display: block; font-size: 12px; color: var(--text-2); line-height: 1.4; }
.ml-note { color: #30d158; font-size: 12.5px; }
/* nouveau message */
.mc { position: relative; display: flex; flex-direction: column; min-height: 0; background: var(--win-bg); }
.mc-tb { height: 50px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--line); background: var(--bar-bg); }
.mc-tb .tl-slot { margin-right: 8px; }
.mc-send { width: 34px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--accent); cursor: pointer; }
.mc-send:hover { background: var(--hover); }
.mc-send svg { width: 19px; height: 19px; }
.mc-title { font-weight: 700; font-size: 13.5px; }
.mc-sp { flex: 1; }
.mc-ic { width: 30px; height: 26px; display: grid; place-items: center; border-radius: 6px; color: var(--text-2); } .mc-ic svg { width: 17px; height: 17px; }
.mc-f { flex: none; display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 16px; border-bottom: 1px solid var(--line); }
.mc-f label { width: 52px; flex: none; color: var(--text-3); text-align: right; font-size: 13px; }

.mc-chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px 2px 2px; border-radius: 999px; background: rgba(10,132,255,.14); color: var(--accent); font-size: 13px; }
.mc-av { width: 22px; height: 22px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 9px; font-weight: 700; color: #fff; background: #8e8e93; }
.mc-av img { width: 100%; height: 100%; object-fit: cover; }
.mc-copy { margin-left: auto; display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-3); cursor: pointer; max-width: 50%; overflow: hidden; white-space: nowrap; }
.mc-copy svg { width: 13px; height: 13px; flex: none; }
.mc-copy:hover { color: var(--accent); }
.mc-sugg { padding: 8px 16px 0; }

.mc-foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line); }
.mc-foot small { color: var(--text-3); font-size: 11.5px; }

/* ==================================================================
   NOTES
   ================================================================== */
.win-notes { --n-acc: #e5a800; }
html[data-theme="dark"] .win-notes { --n-acc: #ffd60a; }
.nt { display: flex; min-height: 0; background: var(--win-bg); }

.nt-h { padding: 6px 8px 4px; font-size: 11px; font-weight: 700; color: var(--text-3); }
.nt-f { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; text-align: left; cursor: pointer; }
.nt-f:hover { background: var(--hover); }
.nt-f.on { background: var(--panel-2); }

.nt-fl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nt-list { width: 290px; flex: none; display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; }
.nt-lh { height: 52px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; }
.nt-mtl { display: none; }
.nt-lh b { display: block; font-size: 15px; } .nt-lh small { font-size: 11.5px; color: var(--text-3); }
.nt-items { flex: 1; overflow: auto; padding: 4px 8px 10px; }

.nt-it > div { flex: 1; min-width: 0; }
.nt-it b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nt-it small { display: block; font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
